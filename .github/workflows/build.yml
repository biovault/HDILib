name: HDILib conan builder

on:
  push:
    branches:
      - master
      - main
      - stable/*
      - release/*
      - alpha/*

  pull_request:
  workflow_dispatch:

env:
  VCPKG_COMMIT_SHA: c3867e714dd3a51c272826eea77267876517ed99 # corresponds to tag 2026.03.18

# for matrix check https://docs.github.com/en/actions/reference/specifications-for-github-hosted-runners
jobs:
  cross-platform-build:
    name: Cross platform build
    # The CMake configure and build commands are platform agnostic and should work equally
    # well on Windows or Mac.  You can convert this to a matrix build if you need
    # cross-platform coverage.
    # See: https://docs.github.com/en/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:

          - name: Windows-msvc2022
            os: windows-2022
            compiler: msvc-2022
            build-cversion: 17
            build-runtime: MD
            build-config: Release
            build-arch: x86_64

          - name: Linux_gcc13
            os: ubuntu-24.04
            build-cc: gcc
            build-cxx: g++
            build-compiler: gcc
            build-cversion: 13
            build-config: Release
            build-os: Linux
            build-libcxx: libstdc++11
            build-arch: x86_64

          - name: Linux_gcc14
            os: ubuntu-24.04
            build-cc: gcc
            build-cxx: g++
            build-compiler: gcc
            build-cversion: 14
            build-config: Release
            build-os: Linux
            build-libcxx: libstdc++11
            build-arch: x86_64

          - name: Macos_xcode14.3
            os: macos-14
            build-compiler: apple-clang
            build-cversion: 14
            build-config: Release
            build-os: Macos
            build-xcode-version: 15.0.1
            build-libcxx: libc++
            build-arch: armv8

          - name: Macos_xcode15
            os: macos-14
            build-compiler: apple-clang
            build-cversion: 15
            build-config: Release
            build-os: Macos
            build-xcode-version: 15.4
            build-libcxx: libc++
            build-arch: armv8

          - name: Macos_xcode16
            os: macos-15
            build-compiler: apple-clang
            build-cversion: 16
            build-config: Release
            build-os: Macos
            build-xcode-version: 16.2
            build-libcxx: libc++
            build-arch: armv8

    steps:
      - name: Checkout the source
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Select Xcode for Mac only
        if: startsWith(runner.os, 'macOS')
        run: |
          sudo xcode-select -switch /Applications/Xcode_${{matrix.build-xcode-version}}.app

      - name: Setup python version
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          
      - name: Set vcpkg environment (Unix)
        if: "!startsWith(runner.os, 'Windows')"
        run: |
          echo "VCPKG_DIR=${{ runner.temp }}/vcpkg" >> $GITHUB_ENV
          echo "VCPKG_ROOT=${{ runner.temp }}/vcpkg" >> $GITHUB_ENV
          echo "VCPKG_BINARY_SOURCES=clear;files,${{ runner.temp }}/vcpkg-cache,readwrite" >> $GITHUB_ENV

      - name: Set vcpkg environmentg (Windows)
        if: startsWith(runner.os, 'Windows')
        shell: pwsh
        run: |
          echo "VCPKG_DIR=${{ runner.temp }}/vcpkg" >> $env:GITHUB_ENV
          echo "VCPKG_ROOT=${{ runner.temp }}/vcpkg" >> $env:GITHUB_ENV
          echo "VCPKG_BINARY_SOURCES=clear;files,${{ runner.temp }}/vcpkg-cache,readwrite" >> $env:GITHUB_ENV

      - name: Set up binary cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-cache-${{ runner.os }}-${{ env.VCPKG_COMMIT_SHA }}-${{ hashFiles('**/vcpkg.json', '**/vcpkg-overlays/**') }}
          restore-keys: |
            vcpkg-cache-${{ runner.os }}-${{ env.VCPKG_COMMIT_SHA }}
  
      - name: Clone and checkout vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git --branch master ${{ env.VCPKG_DIR }}
          git -C ${{ env.VCPKG_DIR }} fetch --depth 1 origin ${{ env.VCPKG_COMMIT_SHA }}
          git -C ${{ env.VCPKG_DIR }} checkout ${{ env.VCPKG_COMMIT_SHA }}

      - name: Bootstrap vcpkg (Unix)
        if: "!startsWith(runner.os, 'Windows')"
        run: ${{ env.VCPKG_DIR }}/bootstrap-vcpkg.sh -disableMetrics

      - name: Bootstrap vcpkg (Windows)
        if: startsWith(runner.os, 'Windows')
        shell: pwsh
        run: ${{ env.VCPKG_DIR }}/bootstrap-vcpkg.bat -disableMetrics
  
      - name: Windows build
        if: startsWith(matrix.os, 'Windows')
        uses: ./.github/conan_windows_build
        with:
          conan-visual-version: ${{matrix.build-cversion}}
          conan-build-type: ${{matrix.build-config}}
          build-arch: ${{matrix.build-arch}}
          conan-user: ${{secrets.LKEB_ARTIFACTORY_USER}}
          conan-password: ${{secrets.LKEB_ARTIFACTORY_PASSWORD}}
          hdilib-cdash-token: ${{secrets.HDILIB_TOKEN}}

      - name: Linux build
        if: startsWith(matrix.os, 'ubuntu')
        uses: ./.github/conan_linuxmac_build
        with:
          conan-compiler: ${{matrix.build-compiler}}
          conan-compiler-version: ${{matrix.build-cversion}}
          conan-libcxx-version: ${{matrix.build-libcxx}}
          conan-build-type: ${{matrix.build-config}}
          conan-build-os: ${{matrix.build-os}}
          build-arch: ${{matrix.build-arch}}
          conan-user: ${{secrets.LKEB_ARTIFACTORY_USER}}
          conan-password: ${{secrets.LKEB_ARTIFACTORY_PASSWORD}}

      - name: Mac build
        if: startsWith(matrix.os, 'macOS')
        uses: ./.github/conan_linuxmac_build
        with:
          conan-compiler: ${{matrix.build-compiler}}
          conan-compiler-version: ${{matrix.build-cversion}}
          conan-libcxx-version: ${{matrix.build-libcxx}}
          conan-build-type: ${{matrix.build-config}}
          conan-build-os: ${{matrix.build-os}}
          build-arch: ${{matrix.build-arch}}
          conan-user: ${{secrets.LKEB_ARTIFACTORY_USER}}
          conan-password: ${{secrets.LKEB_ARTIFACTORY_PASSWORD}}

  # This build for python on linux cannot be performed using the normal matrix
  # because the C libs are not compatible with the python versions 
  Python-ManyLinux-2-28-Build:
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64
    strategy:
      matrix:
        include: 
          - name: python manylinux_2_28_gcc14
            build-cc: gcc
            build-cxx: g++
            build-compiler: gcc
            build-cversion: 14
            build-config: Release
            build-os: Linux
            build-libcxx: libstdc++11
            build-arch: x86_64    
            
    steps:
      - name: Checkout the source
        uses: actions/checkout@v6
        with:
          submodules: recursive
          set-safe-directory: true

      - name: Verify default Python installation
        run: |
          python3 --version
          python3 -m ensurepip --upgrade
          pip3 --version
  
      - name: Verify Python installation
        run: |
          python3 --version
          pip3 --version

      # Ensure zip is available on manylinux before vcpkg setup
      - name: Install zip
        if: contains(matrix.name, 'manylinux')
        run: |
          dnf install -y zip

      - name: Set vcpkg environment
        run: |
          echo "VCPKG_DIR=${{ runner.temp }}/vcpkg" >> $GITHUB_ENV
          echo "VCPKG_ROOT=${{ runner.temp }}/vcpkg" >> $GITHUB_ENV
          echo "VCPKG_BINARY_SOURCES=clear;files,${{ runner.temp }}/vcpkg-cache,readwrite" >> $GITHUB_ENV
          
      - name: Set up binary cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-cache-${{ runner.os }}-${{ hashFiles('**/vcpkg.json', 'vcpkg-overlays/**') }}
          restore-keys: |
            vcpkg-cache-${{ runner.os }}-

      - name: Clone and checkout vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git --branch master ${{ env.VCPKG_DIR }}
          git -C ${{ env.VCPKG_DIR }} fetch --depth 1 origin ${{ env.VCPKG_COMMIT_SHA }}
          git -C ${{ env.VCPKG_DIR }} checkout ${{ env.VCPKG_COMMIT_SHA }}

      - name: Bootstrap vcpkg (Unix)
        run: ${{ env.VCPKG_DIR }}/bootstrap-vcpkg.sh -disableMetrics
          
      - name: Linux build
        uses: ./.github/conan_linuxmac_build
        with:
          conan-compiler: ${{matrix.build-compiler}}
          conan-compiler-version: ${{matrix.build-cversion}}
          conan-libcxx-version: ${{matrix.build-libcxx}}
          conan-build-type: ${{matrix.build-config}}
          conan-build-os: ${{matrix.build-os}}
          conan-channel: python
          build-arch: ${{matrix.build-arch}}
          conan-user: ${{secrets.LKEB_ARTIFACTORY_USER}}
          conan-password: ${{secrets.LKEB_ARTIFACTORY_PASSWORD}}
        env:
          VCPKG_BINARY_SOURCES: "clear"
